<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#07090d">
<title>REAL FACTORY — Universal Production</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#07090d;color:#fff;font:14px system-ui,-apple-system,"Segoe UI",Arial,sans-serif}
#upmFrame{display:block;width:100%;height:100%;border:0;background:#07090d}
#boot{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:#07090d;color:#98a2b3;z-index:2}
</style>
</head>
<body>
<div id="boot">Loading Universal Production…</div>
<iframe id="upmFrame" title="Universal Production Overview"></iframe>
<script src="real-upm-department-router-v9173.js?v=9278"></script>
<script>
(()=>{
'use strict';
const qp=new URLSearchParams(location.search);
const mode=String(qp.get('mode')||'TEST').trim().toUpperCase()==='REAL'?'REAL':'TEST';
function goDepartment(raw,label){return window.RRRouteDepartment?.(raw,label,{mode,from:'UPM'})===true;}
const direct=qp.get('dept');
if(direct&&goDepartment(direct,window.RRCanonicalDepartmentName?.(direct)||qp.get('label')||direct))return;
const frame=document.getElementById('upmFrame');
frame.src=`real-universal-production-v770.html?mode=${encodeURIComponent(mode)}&embedded=UPM_OVERVIEW&v=9278`;
frame.addEventListener('load',()=>{
  document.getElementById('boot').style.display='none';
  const d=frame.contentWindow.document;
  const style=d.createElement('style');
  style.textContent=`
    .checkin{display:none!important}
    #traveller{display:none!important}
    .lot-card{cursor:default!important}
    .toolbar:after{content:'OVERVIEW ONLY · Select a current department to open its live module';display:block;color:#98a2b3;font-size:11px;font-weight:800;margin-left:8px}
    @media(max-width:700px){.toolbar{flex-wrap:wrap}.toolbar:after{width:100%;margin:4px 0 0}}
  `;
  d.head.appendChild(style);
  const select=d.getElementById('homeDept');
  if(select){
    [...select.options].forEach(o=>{
      if(o.value&&!window.RRIsActiveDepartment?.(o.value)){o.disabled=true;o.hidden=true;}
    });
    select.addEventListener('change',e=>{
      if(!select.value)return;
      const dept=window.RRCanonicalDepartment?.(select.value)||select.value;
      const label=window.RRCanonicalDepartmentName?.(dept)||dept;
      if(goDepartment(dept,label)){
        e.preventDefault();e.stopImmediatePropagation();
      }
    },true);
  }
  d.addEventListener('click',e=>{
    const card=e.target.closest?.('.lot-card,[data-open-lot],.checkin');
    if(!card)return;
    e.preventDefault();e.stopImmediatePropagation();
  },true);
}, {once:true});
})();
</script>
</body>
</html>
