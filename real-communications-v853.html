<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0d0d0f">
  <title>REAL FACTORY - WhatsApp Messages V853</title>
  <link rel="stylesheet" href="real-style.css?v=887">
  <style>
    .rf-comm-toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:18px 0;padding:14px 16px;background:#17171b;border:1px solid #2a2a31;border-radius:16px}
    .rf-comm-toolbar label{display:grid;gap:7px;min-width:180px;color:#d6d6dc;font-size:13px;font-weight:800}
    .rf-comm-toolbar select{min-height:42px;padding:10px 12px;border:1px solid #34343d;border-radius:12px;background:#0f0f12;color:#fff;font:inherit}
    .rf-comm-actions{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
    .rf-comm-list{display:grid;gap:12px}
    .rf-comm-card{display:grid;gap:12px;padding:18px;background:#17171b;border:1px solid #2a2a31;border-radius:16px}
    .rf-comm-head{display:flex;justify-content:space-between;gap:14px;align-items:flex-start}
    .rf-comm-title{display:grid;gap:4px}
    .rf-comm-title strong{font-size:16px}
    .rf-comm-title span,.rf-comm-meta{color:#aaaab4;font-size:13px}
    .rf-comm-text{white-space:pre-wrap;margin:0;padding:13px;border-radius:12px;background:#0f0f12;border:1px solid #282830;color:#f4f4f6;line-height:1.48}
    .rf-comm-card-actions{display:flex;gap:10px;flex-wrap:wrap}
    .rf-comm-status{padding:6px 9px;border-radius:999px;background:#202936;color:#a8ccff;font-size:11px;font-weight:900;white-space:nowrap}
    @media(max-width:760px){.rf-comm-toolbar,.rf-comm-head{align-items:stretch;flex-direction:column}.rf-comm-actions,.rf-comm-card-actions{display:grid}.rr-topbar{align-items:flex-start;flex-direction:column}}
  </style>
</head>
<body class="rr-body">
  <header class="rr-topbar">
    <div>
      <p class="rr-kicker">REAL FACTORY</p>
      <h1>WhatsApp Messages</h1>
    </div>
    <div class="rr-top-actions">
      <span class="rf-dashboard-version">V853</span>
      <span id="ownerName" class="rr-owner-name">Loading...</span>
      <a class="rr-btn rr-btn-secondary" href="real-dashboard.html?v=887">Dashboard</a>
      <button id="logoutBtn" class="rr-btn rr-btn-secondary" type="button">Logout</button>
    </div>
  </header>

  <main class="rr-page">
    <section class="rr-hero">
      <div class="rf-hero-copy">
        <p class="rr-muted">TEST DEFAULT - REAL PROTECTED</p>
        <h2>Open WhatsApp Message Flow</h2>
        <p class="rr-muted">Backend outbox rows yahan se WhatsApp Web/App mein prefilled message ke saath open honge. Send manual rahega.</p>
      </div>
      <div id="securityStatus" class="rr-status-pill">WA LINK</div>
    </section>

    <section class="rf-comm-toolbar" aria-label="Message controls">
      <label>
        Status
        <select id="statusFilter">
          <option value="READY">READY</option>
          <option value="PENDING">PENDING</option>
          <option value="OPENED_IN_WHATSAPP">OPENED</option>
          <option value="">ALL</option>
        </select>
      </label>
      <div class="rf-comm-actions">
        <button id="refreshBtn" class="rr-btn rr-btn-secondary" type="button">Refresh</button>
      </div>
    </section>

    <section class="rr-panel">
      <div class="rr-panel-head"><h2>Outbox</h2><span id="rowCount" class="rr-muted">Loading...</span></div>
      <div id="messageList" class="rf-comm-list"><p class="rr-muted">Loading...</p></div>
    </section>

    <p id="pageMessage" class="rr-message" role="status"></p>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js?v=887"></script>
  <script src="real-communications-v853.js?v=887"></script>
<script>
(function(){
  var V='887';
  function localHtml(h){try{var u=new URL(h,location.href);return u.origin===location.origin&&/\.html$/i.test(u.pathname)}catch(e){return false}}
  document.addEventListener('click',function(e){var a=e.target&&e.target.closest?e.target.closest('a[href]'):null;if(!a||a.target||a.hasAttribute('download'))return;var h=a.getAttribute('href')||'';if(!h||h[0]==='#'||/^(mailto:|tel:|javascript:)/i.test(h)||!localHtml(h))return;var u=new URL(h,location.href);if(u.searchParams.get('v')!==V){u.searchParams.set('v',V);e.preventDefault();location.href=u.href;}},true);
})();
</script>
</body>
</html>
