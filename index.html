 <!DOCTYPE html>
<html lang="hi">

<head>

    <!-- ======================================================
         Basic Meta
    ======================================================= -->

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>REDZED Dealer Catalog</title>

    <meta
        name="description"
        content="REDZED Dealer Catalog for T-Shirts, Polo, Shorts, Lowers with live stock, pricing and fabric details.">


    <!-- ======================================================
         Styles
    ======================================================= -->

    <link
        rel="stylesheet"
        href="style.css">

</head>

<body>

    <!-- ======================================================
         Header
    ======================================================= -->

    <header class="nav">

        <div class="logo">
            REDZED
            <span>STORE</span>
        </div>

        <nav>

            <a href="#products">
                Products
            </a>

            <a href="admin.html">
                Admin
            </a>

            <a
                href="#"
                class="wa-link">
                WhatsApp
            </a>

        </nav>

    </header>


    <!-- ======================================================
         Hero Section
    ======================================================= -->

    <section class="hero">

        <div>

            <p class="tag">
                Premium Garments • Wholesale Catalog
            </p>

            <h1>
                REDZED Dealer Catalog
            </h1>

            <p>
                T-Shirts, Polo, Shorts & Lowers.
                New arrivals,
                live rates,
                fabric,
                size
                और stock details.
            </p>

            <div class="hero-actions">

                <a
                    href="#products"
                    class="btn">

                    View Products

                </a>

                <a
                    href="admin.html"
                    class="btn ghost">

                    Admin Panel

                </a>

            </div>

        </div>

    </section>


    <!-- ======================================================
         Search & Filter
    ======================================================= -->

    <section class="tools">

        <input
            id="search"
            type="text"
            placeholder="Search : Art No, Fabric, Product">

        <select id="categoryFilter">

            <option value="all">
                All Categories
            </option>

        </select>

        <select id="stockFilter">

            <option value="all">
                All Stock
            </option>

            <option value="yes">
                In Stock
            </option>

            <option value="no">
                Out of Stock
            </option>

        </select>

    </section>


    <!-- ======================================================
         Product Listing
    ======================================================= -->

    <main
        id="products"
        class="grid">

    </main>


    <!-- ======================================================
         Footer
    ======================================================= -->

    <footer>

        © REDZED •

        Orders on WhatsApp :

        <span class="wa-text"></span>

    </footer>


    <!-- ======================================================
         JavaScript
    ======================================================= -->

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script src="config.js"></script>
    
    <script src="settings.js"></script>
    
    <script src="app.js"></script>

</body>

</html>
