<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#08121d"><title>MISSING RECOVERY</title><style>*{box-sizing:border-box}body{margin:0;background:#07090d;color:#fff;font:800 15px system-ui;padding:16px}.card{max-width:620px;margin:auto;background:#111722;border:1px solid #334155;border-radius:18px;padding:18px}.gold{color:#ffc857}.mut{color:#9ca3af}.row{padding:12px;border:1px solid #354154;border-radius:12px;margin:10px 0}input,button{width:100%;min-height:50px;border-radius:11px;border:1px solid #445168;background:#202838;color:#fff;font:800 16px;padding:10px;margin-top:7px}button{background:#d63b59}.alt{background:#28364a}.ok{color:#72e6a1}.bad{color:#ff8b8b}</style></head><body><main class="card"><div class="gold">REAL FACTORY · MISSING RECOVERY</div><h2 id="title">Loading…</h2><div id="info" class="mut"></div><div id="form"></div><p id="msg"></p></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js?v=9780"></script><script src="real-common.js?v=126"></script><script>(()=>{'use strict';const q=new URLSearchParams(location.search),id=q.get('missing'),db=()=>window.supabaseClient||window.supabaseDb||window.redzedSupabase||window.sb,$=x=>document.getElementById(x),num=x=>Number(x||0);async function rpc(n,a={}){const r=await db().rpc(n,a);if(r.error)throw r.error;return r.data}async function boot(){try{if(!id)throw Error('Missing record context required.');const r=await db().rpc('rr_upm_missing_get_v224',{p_missing_id:id});if(r.error)throw r.error;const m=r.data;if(!m||!m.id)throw Error('Missing record not found.');$('title').textContent='Lot '+m.lot_no+' · Missing '+m.missing_qty+' PCS';$('info').textContent=[m.department_code,m.colour_code,m.size_code,m.status,'Responsibility: '+(m.worker_name||'—')].filter(Boolean).join(' · ');$('form').innerHTML='<div class="row"><b>FOUND PHYSICALLY</b><input id="fq" type="number" min="1" max="'+m.missing_qty+'" step="1" value="'+m.missing_qty+'"><input id="fd" value="'+m.department_code+'" placeholder="Found department"><input id="fn" value="'+(m.worker_name||'')+'" placeholder="Found by name"><button id="found">FOUND · START RECOVERY</button></div><div class="row"><b>SHORT ACCEPTED / NOT FOUND</b><input id="sq" type="number" min="0.01" step="1" value="'+m.missing_qty+'"><input id="note" placeholder="Remarks"><button id="short" class="alt">ACCEPT SHORT</button></div>';$('found').onclick=async()=>{try{const qty=num($('fq').value),wid=m.worker_id;if(qty<=0||qty>num(m.missing_qty))throw Error('FOUND Qty केवल 1 से '+m.missing_qty+' PCS तक हो सकती है.');if(!wid)throw Error('Found-by worker mapping required.');await rpc('rr_upm_missing_found_start_v215',{p_missing_id:id,p_found_qty:qty,p_found_department_code:$('fd').value.trim(),p_found_worker_id:wid,p_found_name:$('fn').value.trim()||m.worker_name,p_remarks:null});$('msg').className='ok';$('msg').textContent='Recovery started · physical receiver acceptance pending';setTimeout(done,500)}catch(e){$('msg').className='bad';$('msg').textContent=e.message||String(e)}};$('short').onclick=async()=>{try{await rpc('rr_upm_missing_short_accept_v216',{p_missing_id:id,p_qty:num($('sq').value),p_remarks:$('note').value.trim()||null});$('msg').className='ok';$('msg').textContent='Short resolution saved';setTimeout(done,500)}catch(e){$('msg').className='bad';$('msg').textContent=e.message||String(e)}}}catch(e){$('msg').className='bad';$('msg').textContent=e.message||String(e)}}function done(){if(parent&&parent!==window)parent.postMessage({type:'RR_REAL_CHAT_ACTION_SUCCESS',action:'MISSING_RECOVERY',status:'WORKING'},location.origin);else history.back()}let t=setInterval(()=>{if(db()?.from){clearInterval(t);boot()}},100)})();</script></body></html>
