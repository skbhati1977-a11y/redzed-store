<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Rectification · Final Close</title>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;background:#07111c;color:#fff;font-family:system-ui,-apple-system,sans-serif}main{max-width:620px;margin:auto;padding:16px}.head{display:flex;align-items:center;gap:10px;margin-bottom:15px}.head button{width:42px;height:42px;border-radius:50%;font-size:24px}.card{padding:16px;border:1px solid #45647e;border-radius:16px;background:#102338}h1{margin:0;font-size:20px}p{color:#b9d2e6}.meta{padding:10px;border-radius:10px;background:#081725;color:#c9e9ff}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}label{display:block;margin-top:13px;color:#b8c9d8;font-size:12px}input,textarea,button{width:100%;min-height:46px;margin-top:5px;padding:10px;border:1px solid #55738d;border-radius:10px;background:#07131f;color:#fff;font:inherit}textarea{min-height:80px}.save{margin-top:16px;background:#edf5fd;color:#102033;font-weight:900}.save:disabled{opacity:.55}.ok{color:#8ff0ae}.bad{color:#ff9b9b}@media(max-width:440px){.grid{grid-template-columns:1fr}}
</style>
</head>
<body><main><div class="head"><button id="back" type="button">‹</button><h1>RECTIFICATION · FINAL CLOSE</h1></div><section class="card"><div id="meta" class="meta">Rectification loading…</div><div class="grid"><label>GOOD QTY<input id="good" type="number" min="0" step="1"></label><label>DAMAGE QTY<input id="damage" type="number" min="0" step="1" value="0"></label><label>ALTER QTY<input id="alter" type="number" min="0" step="1" value="0"></label><label>RECALLED QTY<input id="total" readonly></label></div><label>REMARKS<textarea id="remarks" placeholder="Final rectification remarks"></textarea></label><p id="balance"></p><button id="save" class="save" type="button">RECTIFICATION · FINAL CLOSE</button><p id="state"></p></section></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js?v=9778"></script>
<script>
(()=>{'use strict';const $=id=>document.getElementById(id),db=window.supabaseClient||window.supabaseDb||window.redzedSupabase||window.sb,caseId=new URLSearchParams(location.search).get('case_id');let recalled=0;
function close(ok=false){if(window.parent!==window)window.parent.postMessage({type:ok?'RR_REAL_CHAT_ACTION_SUCCESS':'RR_REAL_CHAT_ACTION_CANCEL'},location.origin);else history.back()}
function sync(){const sum=['good','damage','alter'].reduce((n,id)=>n+Number($(id).value||0),0),left=recalled-sum;$('balance').textContent=left===0?'✓ Full balance matched':left>0?'Balance pending: '+left+' PCS':'Quantity exceeds recalled by '+Math.abs(left)+' PCS';$('balance').className=left===0?'ok':'bad';$('save').disabled=left!==0}
async function boot(){if(!db||!caseId)return $('state').textContent='Rectification mapping unavailable.';const u=await db.auth.getUser();if(u.error||!u.data?.user)return location.href='real-login.html?return='+encodeURIComponent(location.pathname+location.search);const r=await db.rpc('rr_real_chat_rectification_close_form_v1',{p_case_id:caseId});if(r.error||!r.data)return $('state').textContent=r.error?.message||'Rectification not found.';recalled=Number(r.data.recalled_good_qty||0);$('total').value=recalled;$('good').value=recalled;$('meta').textContent='Lot '+r.data.lot_no+' · '+r.data.colour_code+' · '+recalled+' PCS · '+(r.data.assigned_worker_name||r.data.original_worker_name||'Worker');sync()}
['good','damage','alter'].forEach(id=>$(id).oninput=sync);$('back').onclick=()=>close(false);$('save').onclick=async()=>{const b=$('save');b.disabled=true;b.textContent='CLOSING…';const r=await db.rpc('rr_real_chat_close_rectification_v1',{p_case_id:caseId,p_good_qty:Number($('good').value||0),p_damage_qty:Number($('damage').value||0),p_alter_qty:Number($('alter').value||0),p_remarks:$('remarks').value.trim()||null});if(r.error){$('state').textContent=r.error.message;b.textContent='RECTIFICATION · FINAL CLOSE';sync();return}$('state').className='ok';$('state').textContent='✓ RECTIFICATION CLOSED';setTimeout(()=>close(true),500)};boot()})();
</script></body></html>
