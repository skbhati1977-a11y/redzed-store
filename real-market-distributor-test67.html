<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>TEST67 Distributor Market Window</title>
<style>
:root{color-scheme:dark;--bg:#091019;--card:#111d2a;--line:#294158;--muted:#9db0c2;--ok:#42d392;--blue:#4da3ff;--red:#ff6b72}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#f4f7fa;font-family:system-ui,sans-serif}header{position:sticky;top:0;z-index:2;padding:14px 18px;background:#0b1420eF;border-bottom:1px solid var(--line);backdrop-filter:blur(10px)}h1{font-size:18px;margin:0}small,.muted{color:var(--muted)}main{max-width:1120px;margin:auto;padding:16px;display:grid;gap:14px}.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px}h2{font-size:16px;margin:0 0 12px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:9px}input,select,button,textarea{width:100%;border:1px solid #38536c;border-radius:9px;background:#0b1520;color:#fff;padding:10px;font:inherit}button{cursor:pointer;background:#153b61;font-weight:700}button.primary{background:#1769aa}button.danger{background:#682830}.row{display:flex;gap:8px;align-items:center}.row>*{flex:1}.line,.order{border:1px solid #294158;border-radius:10px;padding:10px;margin:8px 0}.order-head{display:flex;gap:8px;align-items:center;justify-content:space-between}.order-head input{width:auto}.pill{border:1px solid #42617e;border-radius:999px;padding:3px 8px;font-size:11px}.money{color:var(--ok)}table{width:100%;border-collapse:collapse;font-size:13px}th,td{padding:8px;border-bottom:1px solid #294158;text-align:left}#notice{position:fixed;right:12px;bottom:12px;max-width:420px;background:#10263a;border:1px solid #3c6d91;padding:11px 14px;border-radius:10px;display:none;z-index:5}@media(max-width:650px){.row{flex-direction:column;align-items:stretch}table{display:block;overflow:auto}}
</style></head><body>
<header><h1>TEST67 · Distributor Market Window</h1><small>Private customers · owner-wide orders · batch submission · PI confirmation</small></header>
<main>
 <section class="card"><h2>Private customer</h2><div class="grid"><input id="customerName" placeholder="Customer name (private)"><input id="customerMobile" placeholder="Mobile (private)"><button id="addCustomer">Create auto Customer ID</button></div></section>
 <section class="card"><h2>Create Order / Requirement</h2><div class="grid"><select id="orderCustomer"></select><input id="lotNo" placeholder="Lot / Article No."><input id="qty" type="number" min="1" placeholder="Quantity"><input id="enhancement" type="number" min="0" step="0.01" placeholder="Rate Enhancement ₹"><button id="addLine">Add article</button></div><div id="draftLines"></div><button class="primary" id="createOrder">Create Order</button></section>
 <section class="card"><h2>Customer-wise orders</h2><div id="orders"></div><button class="primary" id="submitBatch">Send selected orders in one batch</button></section>
 <section class="card"><h2>Batches</h2><div id="batches"></div></section>
</main><div id="notice"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js?v=67"></script><script src="real-common.js?v=67"></script><script src="rf-v853-core.js?v=67"></script><script src="real-customer-secure-session-addon-v9592.js?v=67"></script><script src="real-market-distributor-test67.js?v=67"></script>
</body></html>
