<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover"
    />
    <title>Distributor Directory · TEST67</title>
    <style>
      :root {
        color-scheme: dark;
        --bg: #07111d;
        --panel: #101f2e;
        --line: #2d4860;
        --muted: #9fb0c3;
        --blue: #1687d8;
        --green: #188052;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        min-height: 100%;
        background: var(--bg);
        color: #f7f9fc;
        font-family:
          system-ui,
          -apple-system,
          sans-serif;
      }
      button,
      input,
      select {
        font: inherit;
      }
      .top {
        position: sticky;
        top: 0;
        z-index: 40;
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 10px 12px;
        background: #091725f2;
        border-bottom: 1px solid var(--line);
      }
      .brand {
        flex: 1;
      }
      .brand b {
        display: block;
        font-size: 18px;
      }
      .brand small,
      .muted {
        color: var(--muted);
      }
      .icon {
        width: 46px;
        height: 46px;
        border: 1px solid #45647e;
        border-radius: 13px;
        background: #13283a;
        color: #fff;
        font-size: 21px;
      }
      .blue {
        background: var(--blue) !important;
      }
      .wrap {
        max-width: 760px;
        margin: auto;
        padding: 10px;
      }
      .card,
      .customer {
        border: 1px solid var(--line);
        border-radius: 15px;
        background: var(--panel);
        padding: 11px;
        margin: 9px 0;
      }
      .directoryTools {
        display: grid;
        grid-template-columns: 1fr;
        gap: 8px;
      }
      .filebtn,
      input,
      select,
      .sheet button {
        width: 100%;
        min-height: 47px;
        border: 1px solid #45627d;
        border-radius: 10px;
        background: #081520;
        color: #fff;
        padding: 10px;
      }
      .filebtn {
        display: flex;
        align-items: center;
        justify-content: center;
        border-style: dashed;
        font-weight: 850;
      }
      .customer {
        display: flex;
        align-items: center;
        gap: 10px;
        cursor: pointer;
      }
      .avatar {
        width: 43px;
        height: 43px;
        flex: 0 0 43px;
        border-radius: 50%;
        display: grid;
        place-items: center;
        background: #1b547f;
        font-weight: 900;
      }
      .grow {
        flex: 1;
        min-width: 0;
      }
      .grow b,
      .grow small {
        display: block;
      }
      .grow small {
        color: var(--muted);
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .importRow,
      .tabs {
        display: grid;
        grid-template-columns: 120px 1fr;
        gap: 8px;
      }
      .tabs {
        grid-template-columns: 1fr 1fr;
      }
      .tabs button,
      .statusBtn {
        min-height: 42px;
        border: 1px solid #45627d;
        border-radius: 10px;
        background: #081520;
        color: #fff;
        font-weight: 800;
      }
      .tabs button.on {
        background: #fff;
        color: #07111d;
      }
      .statusBtn {
        width: auto !important;
        min-width: 82px;
        padding: 7px 9px !important;
        color: #79e7ad !important;
      }
      .statusBtn.off {
        color: #ff9ba1 !important;
      }
      .kindBadge {
        color: #72c7ff;
        font-size: 11px;
        font-weight: 900;
      }
      .drawerBack,
      .modalBack {
        position: fixed;
        inset: 0;
        z-index: 80;
        background: #000c;
        display: none;
      }
      .drawerBack.on,
      .modalBack.on {
        display: flex;
      }
      .drawer {
        width: min(330px, 88vw);
        height: 100%;
        background: #0d1b29;
        padding: 13px;
        border-right: 1px solid var(--line);
      }
      .drawer button {
        display: block;
        width: 100%;
        min-height: 48px;
        margin: 6px 0;
        border: 1px solid var(--line);
        border-radius: 10px;
        background: #13283a;
        color: #fff;
        text-align: left;
        padding: 10px;
        font-weight: 800;
      }
      .sheet {
        margin: auto;
        width: min(650px, calc(100% - 18px));
        max-height: 92dvh;
        overflow: auto;
        background: #0d1b29;
        border: 1px solid #46647e;
        border-radius: 18px;
        padding: 13px;
      }
      .sheetHead {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-bottom: 10px;
      }
      .sheetHead b {
        flex: 1;
        font-size: 18px;
      }
      .form {
        display: grid;
        gap: 8px;
      }
      .listItem {
        padding: 9px;
        border: 1px solid var(--line);
        border-radius: 10px;
        margin: 7px 0;
      }
      .switchRow {
        display: flex;
        align-items: center;
        gap: 9px;
      }
      .switchRow input {
        width: 24px;
        min-height: 24px;
      }
      .notice {
        position: fixed;
        left: 50%;
        bottom: 15px;
        transform: translateX(-50%);
        z-index: 120;
        display: none;
        max-width: calc(100% - 24px);
        background: #12314a;
        border: 1px solid #5484a9;
        border-radius: 10px;
        padding: 10px 14px;
      }
      .empty {
        text-align: center;
        color: var(--muted);
        padding: 24px;
      }
      .hidden {
        display: none !important;
      }
      .checkRow {
        display: flex;
        align-items: center;
        gap: 9px;
        min-height: 47px;
        padding: 8px 4px;
      }
      .checkRow input {
        width: 24px;
        min-height: 24px;
      }
      @media (max-width: 520px) {
        .importRow {
          grid-template-columns: 105px 1fr;
        }
        .brand small {
          display: none;
        }
      }
    </style>
  </head>
  <body>
    <header class="top">
      <button id="menuBtn" class="icon">☰</button>
      <div class="brand">
        <b id="brandTitle">DISTRIBUTOR</b
        ><small>Customer Directory · TEST67</small>
      </div>
      <button id="addBtn" class="icon blue" aria-label="Add contact">
        ＋
      </button>
    </header>
    <main class="wrap">
      <section class="card">
        <div class="directoryTools">
          <div class="importRow">
            <select id="vcfKind" aria-label="Import contact type">
              <option value="CUSTOMER">CUSTOMER</option>
              <option value="STAFF">STAFF</option>
            </select>
            <label class="filebtn"
              >📇 IMPORT VCF<input
                id="vcfFile"
                type="file"
                accept=".vcf,text/vcard,text/x-vcard"
                hidden /></label>
          </div>
          <input
            id="customerSearch"
            placeholder="Search name / mobile"
          />
          <div class="tabs">
            <button id="customersTab" class="on" type="button">CUSTOMERS</button>
            <button id="staffTab" type="button">STAFF</button>
          </div>
        </div>
        <div id="vcfStatus" class="muted"></div>
      </section>
      <section id="customers"></section>
    </main>
    <div id="drawerBack" class="drawerBack">
      <nav class="drawer">
        <h2>Distributor Menu</h2>
        <button id="redzedChatBtn">💬 REDZED Chat</button
        ><button id="groupsBtn">🗂 Groups</button
        ><button id="staffBtn">🧑‍💼 Staff</button
        ><button data-close="drawerBack">✕ Close</button>
      </nav>
    </div>
    <div id="addBack" class="modalBack">
      <section class="sheet">
        <div class="sheetHead">
          <b id="contactSheetTitle">Add Contact</b
          ><button class="icon" data-close="addBack">✕</button>
        </div>
        <div class="form">
          <select id="contactKind">
            <option value="CUSTOMER">CUSTOMER</option>
            <option value="STAFF">STAFF</option>
          </select>
          <input id="contactName" placeholder="Contact name" /><input
            id="contactMobile"
            placeholder="Mobile / WhatsApp"
          />
          <select id="contactRole">
            <option>SALES</option>
            <option>MANAGER</option>
            <option>COLLECTION</option>
          </select>
          <label class="checkRow"><input id="contactActive" type="checkbox" checked> Active</label>
          <button id="saveContact" class="blue">SAVE CONTACT</button>
        </div>
      </section>
    </div>
    <div id="groupsBack" class="modalBack">
      <section class="sheet">
        <div class="sheetHead">
          <b>Groups</b><button class="icon" data-close="groupsBack">✕</button>
        </div>
        <p class="muted">Every customer has one permanent group. Active staff are enrolled automatically.</p>
        <div id="groups"></div>
      </section>
    </div>
    <div id="notice" class="notice"></div>
    <script>
      window.__RR_SLICE_MENU_LOADER_9309__ = true;
    </script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="config.js?v=67"></script>
    <script src="real-common.js?v=67"></script>
    <script src="rf-v853-core.js?v=67"></script>
    <script src="real-customer-secure-session-addon-v9592.js?v=67"></script>
    <script src="real-market-distributor-directory-test67.js?v=83"></script>
    <script src="real-mobile-back-step-test67.js?v=75"></script>
  </body>
</html>
