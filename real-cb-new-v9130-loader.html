<script>
(()=>{
  const frame=document.getElementById('cbApp');
  let injected=false;
  function injectFresh(){
    if(injected)return;
    const w=frame.contentWindow,d=frame.contentDocument;
    if(!w||!d)return;
    const gallery=d.getElementById('gallery');
    const stuck=!w.REAL_FACTORY_PRODUCT_MASTER_VERSION || /Loading Product Master/i.test(gallery?.textContent||'');
    if(!stuck)return;
    injected=true;
    const core=d.createElement('script');
    core.src='real-product-master-v804.js?v=804&fix=20260816d';
    core.onload=()=>{
      const map=d.createElement('script');
      map.src='real-product-master-v804-cb-purchase-map-v9133.js?v=9133&fix=20260816d';
      d.body.appendChild(map);
    };
    d.body.appendChild(core);
  }
  frame.addEventListener('load',()=>{
    setTimeout(injectFresh,1200);
    setTimeout(injectFresh,3500);
  });
})();
</script>
</body>
