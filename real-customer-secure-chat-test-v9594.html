<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Secure Chat V9594 Test</title><style>body{font-family:system-ui;background:#0c1016;color:#fff;padding:18px}button,input{font-size:16px;padding:12px;margin:5px 0;width:100%;box-sizing:border-box}pre{white-space:pre-wrap;background:#151c26;padding:12px;border-radius:12px;max-height:55vh;overflow:auto}</style></head><body><h2>Trusted Session Chat V9594 · TEST</h2><p>Isolated browser test. Production chat is unchanged.</p><button id="read">1. READ CHAT SECURELY</button><input id="msg" value="STEP11 V9594 BROWSER TEST"><button id="send">2. SEND TEST MESSAGE SECURELY</button><pre id="out">Waiting for secure session…</pre><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js?v=9435"></script><script src="real-common.js"></script><script src="rf-v853-core.js"></script><script src="real-customer-secure-session-addon-v9592.js?v=9594"></script><script>const out=document.getElementById('out');async function ctx(){await RR_CUSTOMER_SECURE_SESSION_V9592.ensure();const s=JSON.parse(localStorage.getItem('rr_customer_secure_session_v9592')||'null');if(!s?.session_token)throw Error('Secure session missing');return {t:s.session_token,d:RR_CUSTOMER_SECURE_SESSION_V9592.device()}}async function read(){try{const x=await ctx(),r=await RF853.rpc('rr_chat_customer_messages_session_v9593',{p_session_token:x.t,p_device_id:x.d,p_channel:'GROUP',p_limit:10});out.textContent='SECURE READ PASS\n'+JSON.stringify(r,null,2)}catch(e){out.textContent='ERROR: '+e.message}}document.getElementById('read').onclick=read;document.getElementById('send').onclick=async()=>{try{const x=await ctx(),body=document.getElementById('msg').value.trim();const id=await RF853.rpc('rr_chat_customer_send_session_v9593',{p_session_token:x.t,p_device_id:x.d,p_channel:'GROUP',p_message_type:'TEXT',p_body:body,p_payload:{test:'V9594'},p_reply_to:null});out.textContent='SECURE SEND PASS\nmessage_id: '+id+'\nRefreshing…';setTimeout(read,350)}catch(e){out.textContent='ERROR: '+e.message}};document.addEventListener('rr:customer-secure-session-ready',()=>{out.textContent='SECURE SESSION READY\nPress READ CHAT SECURELY.'});document.addEventListener('rr:customer-secure-session-error',e=>{out.textContent='SESSION ERROR: '+e.detail.message});</script></body></html>
