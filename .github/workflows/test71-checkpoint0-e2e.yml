name: TEST71 Current Checkpoint E2E

on:
  workflow_dispatch:
  push:
    branches:
      - test71-real-chat-e2e-finalization
    paths:
      - api/e2e-session.js
      - api/_github-oidc.js
      - tests/e2e/**
      - supabase/migrations/**
      - scripts/e2e-env-status.js
      - playwright.config.js
      - package.json
      - package-lock.json
      - .github/workflows/test71-checkpoint0-e2e.yml

permissions:
  contents: read
  id-token: write

concurrency:
  group: test71-full-factory-${{ github.sha }}
  cancel-in-progress: false

jobs:
  checkpoint0:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      E2E_BASE_URL: https://redzed-test65-git-test71-real-chat-e2e-6adad3-skbhati1977-4414.vercel.app
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e:env-status
      - run: npm run test:e2e:static
      - id: auth
        run: npx playwright test --project=auth-setup
      - if: ${{ !cancelled() && steps.auth.outcome == 'success' }}
        run: npx playwright test --project=mc1 --no-deps
      # MC1's auth-setup writes the reusable Super Admin storage state once.
      # Later suites must reuse it instead of replaying the one-time OIDC token.
      - if: ${{ !cancelled() && steps.auth.outcome == 'success' }}
        run: npx playwright test --project=cb-department --no-deps
      - if: ${{ !cancelled() && steps.auth.outcome == 'success' }}
        run: npx playwright test --project=material-unit --no-deps
      - if: ${{ !cancelled() && steps.auth.outcome == 'success' }}
        run: npx playwright test --project=checkpoint-8 --no-deps
      - if: ${{ !cancelled() && steps.auth.outcome == 'success' }}
        run: npx playwright test --project=full-factory --no-deps
      - name: Upload Playwright evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: checkpoint8-playwright-evidence
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
