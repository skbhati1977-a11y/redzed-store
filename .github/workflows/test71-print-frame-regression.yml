name: TEST71 Print and Projection Regression

on:
  push:
    branches: [test71-real-chat-e2e-finalization]
    paths:
      - real-print-master.html
      - real-print-master.js
      - test70-real-chat-live-v70.js
      - test70-cb-purchase-real-chat-pilot.html
      - tests/e2e/**
      - scripts/test-real-chat-projection-gate-v712.cjs
      - scripts/test71-print-navigation-browser.cjs
      - package.json
      - package-lock.json
      - .github/workflows/test71-print-frame-regression.yml

permissions:
  contents: read

concurrency:
  group: test71-print-frame-regression-${{ github.ref }}
  cancel-in-progress: false

jobs:
  regression:
    if: github.repository == 'skbhati1977-a11y/redzed-store' && github.ref == 'refs/heads/test71-real-chat-e2e-finalization'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install test dependencies without lifecycle scripts
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Check touched runtime syntax
        run: |
          node --check real-print-master.js
          node --check test70-real-chat-live-v70.js
          node --check scripts/test71-print-navigation-browser.cjs
      - name: Retained static suite including print frame independence
        shell: bash
        run: |
          set -euo pipefail
          npm run test:e2e:static | tee "${RUNNER_TEMP}/test71-static.log"
      - name: Retained Real Chat projection gate
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set -euo pipefail
          npm run test:real-chat-projection | tee "${RUNNER_TEMP}/test71-projection.log"
      - name: Install browser for isolated UI regression
        run: npx playwright install --with-deps chromium
      - name: Real Print and Real Chat browser regression without live database writes
        env:
          TEST71_EVIDENCE_DIR: ${{ runner.temp }}/test71-browser-evidence
        shell: bash
        run: |
          set -euo pipefail
          node scripts/test71-print-navigation-browser.cjs | tee "${RUNNER_TEMP}/test71-browser.log"
      - name: Archive exact tested source and commit
        if: ${{ !cancelled() }}
        run: |
          git rev-parse HEAD > "${RUNNER_TEMP}/test71-tested-sha.txt"
          git archive --format=tar.gz --output="${RUNNER_TEMP}/test71-source.tar.gz" HEAD
      - name: Preserve static and browser diagnostics
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: test71-static-diagnostics
          path: |
            ${{ runner.temp }}/test71-static.log
            ${{ runner.temp }}/test71-projection.log
            ${{ runner.temp }}/test71-browser.log
            ${{ runner.temp }}/test71-browser-evidence/
            ${{ runner.temp }}/test71-tested-sha.txt
            ${{ runner.temp }}/test71-source.tar.gz
          retention-days: 7
