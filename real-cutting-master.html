<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0b0b0e">
  <title>REAL FACTORY - Cutting Master</title>
  <style>
    html,body{margin:0;min-height:100%;background:#0b0b0e;color:#fff;font-family:Inter,system-ui,-apple-system,"Segoe UI",sans-serif}
    .boot{min-height:100vh;display:grid;place-items:center;text-align:center;padding:24px}
    .boot b{font-size:24px}.boot p{color:#b7b7c0}.spin{width:34px;height:34px;margin:0 auto 18px;border:3px solid #444;border-top-color:#ef3340;border-radius:50%;animation:s .8s linear infinite}@keyframes s{to{transform:rotate(360deg)}}
  </style>
</head>
<body>
  <div class="boot" id="rrCuttingBoot"><div><div class="spin"></div><b>Starting Cutting Master…</b><p>Loading fresh v9204 runtime.</p></div></div>
  <script>
  (()=>{
    const templateUrl='real-cutting-master-v9203.html?template=9204';
    const fail=message=>{
      const box=document.getElementById('rrCuttingBoot');
      if(box)box.innerHTML='<div><b>Cutting Master startup failed</b><p>'+String(message||'Template load failed')+'</p><button onclick="location.reload()" style="min-height:46px;padding:0 18px;border:0;border-radius:12px;background:#ef3340;color:#fff;font-weight:900">Retry</button></div>';
    };
    fetch(templateUrl,{cache:'no-store'})
      .then(response=>{if(!response.ok)throw new Error('Template HTTP '+response.status);return response.text()})
      .then(html=>{
        html=html
          .replaceAll('config.js?v=9203','config.js?v=9204')
          .replaceAll('real-common.js?v=9203','real-common.js?v=9204')
          .replaceAll('real-cutting-runtime-v9203.js?v=9203','real-cutting-runtime-v9204.js?v=9204')
          .replaceAll('real-cutting-master-pm.V719.3.js?v=9203','real-cutting-master-pm.V719.3.js?v=9204')
          .replaceAll('redzed-cutting-cb-actions-v72035.js?v=9203','redzed-cutting-cb-actions-v72035.js?v=9204');
        document.open();
        document.write(html);
        document.close();
      })
      .catch(error=>fail(error?.message||error));
  })();
  </script>
</body>
</html>
