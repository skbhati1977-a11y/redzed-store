 <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>REDZED REAL — Production Board & Cutting Master</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background-color: #121212; color: #ffffff; padding: 20px; }
        
        /* Header Panel */
        .header-panel { display: flex; justify-content: space-between; align-items: center; background: #1e1e24; padding: 15px 20px; border-radius: 8px; margin-bottom: 20px; border: 1px solid #333; }
        .header-title { font-size: 20px; font-weight: bold; color: #ffffff; }
        .dept-filter-box { display: flex; align-items: center; gap: 10px; }
        .dept-select { background: #2a2a35; color: #00ffcc; border: 1px solid #444; padding: 10px 15px; border-radius: 6px; font-size: 14px; font-weight: bold; outline: none; cursor: pointer; }
        
        /* Banner Status Messages */
        #status-message-green { display: none; background: #2ecc71; color: #ffffff; padding: 12px; border-radius: 6px; font-weight: bold; margin-bottom: 15px; text-align: center; font-size: 14px; border: 1px solid #27ae60; }
        #status-message-red { display: none; background: #e74c3c; color: #ffffff; padding: 12px; border-radius: 6px; font-weight: bold; margin-bottom: 15px; text-align: center; font-size: 14px; border: 1px solid #c0392b; }
        
        /* Board Grid Layout */
        .board-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 15px; margin-top: 10px; }
        
        /* Cutting Form Panel */
        .cutting-panel { background: #1a1a20; border: 1px solid #333; padding: 20px; border-radius: 8px; margin-bottom: 20px; }
        .form-group { margin-bottom: 15px; }
        .form-group label { display: block; margin-bottom: 5px; font-size: 13px; color: #aaa; font-weight: bold; }
        .form-control { width: 100%; background: #2a2a35; color: #fff; border: 1px solid #444; padding: 10px; border-radius: 6px; outline: none; font-size: 14px; }
        .btn-release-main { width: 100%; background: #e74c3c; color: #fff; border: none; padding: 12px; font-size: 16px; font-weight: bold; border-radius: 6px; cursor: pointer; transition: 0.2s; }
        .btn-release-main:hover { background: #c0392b; }
    </style>
    <!-- Supabase JS Client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

    <!-- Top Navigation & Department Selector -->
    <div class="header-panel">
        <div class="header-title">
            REDZED REAL <span style="color: #e74c3c;">— Production Board</span>
        </div>
        <div class="dept-filter-box">
            <label for="dept-select-filter" style="font-size: 14px; color: #bbb;">Select Department / Queue:</label>
            <select id="dept-select-filter" class="dept-select">
                <option value="OPEN_RANDOM_QUEUE" selected>OPEN RANDOM QUEUE</option>
                <option value="ALL">ALL DEPARTMENTS (Read-Only)</option>
                <option value="PRINTING">PRINTING</option>
                <option value="KAAJ">KAAJ</option>
                <option value="PRESS">PRESS</option>
                <option value="PACKING">PACKING</option>
            </select>
        </div>
    </div>

    <!-- Live Dynamic Banners -->
    <div id="status-message-green"></div>
    <div id="status-message-red"></div>

    <!-- Cutting Lot Release Panel -->
    <div class="cutting-panel">
        <h3 style="margin-bottom: 15px; color: #00ffcc; font-size: 16px;">CUTTING MASTER — RELEASE LOT PANEL</h3>
        <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px;">
            <div class="form-group">
                <label for="manual_lot_no">Manual Lot No *</label>
                <input type="text" id="manual_lot_no" class="form-control" placeholder="e.g. 2603" required>
            </div>
            <div class="form-group">
                <label for="operator_name">Cutting Master Operator *</label>
                <select id="operator_name" class="form-control">
                    <option value="">Loading Mapped Workers...</option>
                </select>
            </div>
        </div>
        <button id="btn-release-lot" class="btn-release-main" style="margin-top: 10px;">RELEASE LOT NO</button>
    </div>

    <!-- Main Production Board Cards Container -->
    <div id="board-container" class="board-grid">
        <!-- Cards loaded dynamically from real-universal-production-v729.js -->
    </div>

    <!-- Universal Supabase Client Setup -->
    <script>
        const SUPABASE_URL = 'YOUR_SUPABASE_URL_HERE';
        const SUPABASE_ANON_KEY = 'YOUR_SUPABASE_ANON_KEY_HERE';
        
        if (typeof supabase === 'undefined' && typeof supabaseClient === 'undefined') {
            window.supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
        } else if (typeof supabase === 'undefined' && typeof supabaseClient !== 'undefined') {
            window.supabase = supabaseClient;
        }
    </script>

    <!-- Main JS Engine File -->
    <script src="real-universal-production-v729.js"></script>

</body>
</html>
