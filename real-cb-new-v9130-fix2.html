<script>
(()=>{
  const frame=document.getElementById('cbApp');
  let initialized=false;
  function install(){
    const w=frame.contentWindow,d=frame.contentDocument;
    if(!w||!d)return;

    const sheet=d.getElementById('cbSheet');
    if(sheet){
      sheet.classList.remove('hidden');
      sheet.setAttribute('aria-hidden','false');
      d.body.style.overflow='hidden';
    }

    if(!d.getElementById('cbRouteFix20260816f')){
      const map=d.createElement('script');
      map.id='cbRouteFix20260816f';
      map.src='real-product-master-v804-cb-purchase-map-v9133.js?v=9133&fix=20260816f';
      d.body.appendChild(map);
    }

    let tries=0;
    const open=()=>{
      if(initialized)return;
      const btn=d.getElementById('openCbNew');
      if(btn&&typeof btn.onclick==='function'){
        initialized=true;
        btn.click();
        return;
      }
      if(++tries<150)setTimeout(open,200);
    };
    open();
  }
  frame.addEventListener('load',()=>{
    setTimeout(install,50);
    setTimeout(install,500);
    setTimeout(install,1500);
  });
})();
</script>
