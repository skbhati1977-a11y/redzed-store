<script>
(()=>{
  const frame=document.getElementById('cbApp');
  function openWhenReady(){
    const d=frame.contentDocument;
    if(!d)return setTimeout(openWhenReady,100);
    const btn=d.getElementById('openCbNew');
    if(btn && typeof btn.onclick==='function'){
      btn.click();
      return;
    }
    setTimeout(openWhenReady,100);
  }
  frame.addEventListener('load',openWhenReady);
})();
