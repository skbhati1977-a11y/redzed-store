<script>
(() => {
 const q=new URLSearchParams(location.search),raw=(q.get('dept')||'').trim().toUpperCase();
 const A={KR:'STITCHING',KARIGAR:'STITCHING',STITCH:'STITCHING',STITCHING:'STITCHING',OV:'OVERLOCK',OVERLOCK:'OVERLOCK',FLD:'FOLDING',FOLDING:'FOLDING',KAAJ:'KAAJ',KAJ:'KAAJ',BUTTON:'BUTTON',BTN:'BUTTON',KAAJ_BUTTON:'KAAJ_BUTTON',TEAK:'TEAK_TANKI',TANKI:'TEAK_TANKI',TEAK_TANKI:'TEAK_TANKI',THREAD_CUT:'THREAD_CUT',TH_CUT:'THREAD_CUT',QC:'QC',PRESS:'PRESS',PRINT:'PRINTING',PRINTING:'PRINTING',STICKER:'STICKER',ID:'METAL_ID',METAL_ID:'METAL_ID',PACK:'PACKING',PACKING:'PACKING',DESPATCH:'DESPATCH',DISPATCH:'DESPATCH',CUT:'CUTTING',CUTTING:'CUTTING'};
 const L={STITCHING:'Karigar / Stitching',OVERLOCK:'Overlock',FOLDING:'Folding',KAAJ:'Kaaj',BUTTON:'Button',KAAJ_BUTTON:'Kaaj / Button',TEAK_TANKI:'Teak / Tanki',THREAD_CUT:'Thread Cutting',QC:'QC',PRESS:'Press',PRINTING:'Printing',STICKER:'Sticker',METAL_ID:'Metal ID',PACKING:'Packing',DESPATCH:'Despatch',CUTTING:'Cutting'};
 const dept=A[raw]||raw,label=(q.get('label')||L[dept]||dept||'Department').trim();
 if(!dept){location.replace('real-universal-production-v770-v9059.html?v=9128');return;}
 document.title='REAL FACTORY — '+label;document.getElementById('deptHeader').textContent=label;
 const hd=document.getElementById('homeDept');hd.innerHTML='<option value="'+dept+'" selected>'+label+'</option>';hd.value=dept;hd.hidden=true;hd.setAttribute('aria-hidden','true');
 document.getElementById('search').addEventListener('input',e=>{const s=String(e.target.value||'').trim().toLowerCase();document.querySelectorAll('.rfcard').forEach(c=>{c.style.display=!s||c.textContent.toLowerCase().includes(s)?'':'none'})});
})();
</script>
