<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>REAL FACTORY · Rate Review</title><style>body{margin:0;background:#090b10;color:#f4f6fb;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif}.wrap{max-width:760px;margin:0 auto;padding:18px}.card{border:1px solid #2a303c;border-radius:12px;background:#131720;padding:16px;margin:12px 0}.k{color:#ffd76a;font-weight:800;font-size:13px}.muted{color:#a9afbd}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}.stat{border:1px solid #2a303c;border-radius:10px;padding:10px;background:#0e1118}.stat b{display:block;font-size:22px}input,button{width:100%;box-sizing:border-box;border-radius:10px;border:1px solid #343b49;background:#080a0f;color:#fff;padding:13px;font:inherit}button{background:#e91f37;border:0;font-weight:900;margin-top:10px}.ok{background:#148553}.imgs{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:8px}.imgs img{width:100%;height:160px;object-fit:cover;border-radius:10px;border:1px solid #2a303c}.msg{font-weight:800;color:#ff8090;white-space:pre-wrap}.msg.ok{color:#62df91;background:transparent}.hide{display:none}</style></head><body><main class="wrap"><div class="k">REAL FACTORY</div><h1>Final Rate Review</h1><p class="muted">WhatsApp approval link se rate suggestion/final approval.</p><section id="login" class="card hide"><h2>Login Required</h2><p class="muted">Is review link ko open karne ke liye same authorized account se login karein.</p><input id="email" type="email" placeholder="Email"><input id="password" type="password" placeholder="Password"><button id="loginBtn">LOGIN & OPEN REVIEW</button></section><section id="review" class="card hide"><div class="k" id="role"></div><h2 id="lot">Lot</h2><div class="grid"><div class="stat"><span>Qty</span><b id="qty">-</b></div><div class="stat"><span>Mapped Costing Rate</span><b id="sourceRate">-</b></div><div class="stat"><span>Sales Suggestion</span><b id="salesRate">-</b></div><div class="stat"><span>Admin Suggestion</span><b id="adminRate">-</b></div></div><h3>Final Photos</h3><div id="imgs" class="imgs"></div><div id="action" class="card"></div></section><p id="msg" class="msg"></p></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script>const SUPABASE_URL='https://hruartsemierwhtzonei.supabase.co';const SUPABASE_ANON_KEY='sb_publishable_uo3dcrFuRvGsvRzPcdTV0A_5ZVwgzga';const sb=supabase.createClient(SUPABASE_URL,SUPABASE_ANON_KEY,{auth:{persistSession:true,autoRefreshToken:true,detectSessionInUrl:true}});const $=id=>document.getElementById(id);const token=decodeURIComponent((location.hash||'').replace(/^#/,''));function money(v){return v==null||v===''?'-':'₹'+Number(v).toLocaleString('en-IN')}function show(t,c){$('msg').textContent=t||'';$('msg').className='msg '+(c||'')}async function rpc(name,args){const {data,error}=await sb.rpc(name,args);if(error)throw error;return data}async function load(){show('');if(!token)throw Error('Approval token missing');let ctx;try{ctx=await rpc('rr_pack_rate_token_context_v9346',{p_token:token})}catch(e){if(/Login required/i.test(String(e.message||e))){$('login').classList.remove('hide');$('review').classList.add('hide');return}throw e}$('login').classList.add('hide');$('review').classList.remove('hide');$('role').textContent=(ctx.recipient_name||'')+' · '+String(ctx.recipient_role||ctx.current_role||'').toUpperCase();$('lot').textContent='Lot: '+ctx.lot_no+' · '+ctx.status;$('qty').textContent=Number(ctx.qty||0).toLocaleString('en-IN');$('sourceRate').textContent=money(ctx.source_rate);$('salesRate').textContent=money(ctx.sales_suggested_rate);$('adminRate').textContent=money(ctx.admin_suggested_rate);$('imgs').innerHTML=(ctx.image_urls||[]).map(u=>'<img src="'+String(u).replace(/"/g,'&quot;')+'" alt="Final garment photo">').join('')||'<p class="muted">No final photos found.</p>';if(ctx.can_approve){$('action').innerHTML='<h3>Super Admin Final Approval</h3><input id="rate" type="number" min="1" step="1" placeholder="Final rate"><button class="ok" id="approve">APPROVE FINAL RATE</button>';$('approve').onclick=approve}else if(ctx.can_suggest){$('action').innerHTML='<h3>Rate Suggestion</h3><input id="rate" type="number" min="1" step="1" placeholder="Suggested rate"><button id="suggest">SUBMIT SUGGESTION</button>';$('suggest').onclick=suggest}else{$('action').innerHTML='<p class="muted">Aapke role ke liye action available nahi hai.</p>'}}async function suggest(){try{const r=Number($('rate').value||0);if(!r)throw Error('Rate fill karein');await rpc('rr_pack_rate_token_suggest_v9346',{p_token:token,p_suggested_rate:r});show('Suggestion saved. Link used ho gaya.','ok');$('action').innerHTML=''}catch(e){show(e.message||String(e))}}async function approve(){try{const r=Number($('rate').value||0);if(!r)throw Error('Final rate fill karein');await rpc('rr_pack_rate_token_approve_v9346',{p_token:token,p_final_rate:r});show('Final rate approved. Packing page refresh karein.','ok');$('action').innerHTML=''}catch(e){show(e.message||String(e))}}$('loginBtn').onclick=async()=>{try{show('Login ho raha hai...');const {error}=await sb.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});if(error)throw error;await load()}catch(e){show(e.message||String(e))}};load().catch(e=>show(e.message||String(e)));</script></body></html>
