<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>REAL FACTORY — Final Rate Review</title><style>
:root{font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;background:#07101c;color:#f4f7fb}.page{max-width:760px;margin:auto;padding:16px}.card{background:#0e1826;border:1px solid #27364b;border-radius:18px;padding:16px;margin:12px 0}.head{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}.k{font-size:12px;letter-spacing:.12em;color:#8ca2bd;font-weight:800}.title{font-size:26px;margin:3px 0 0}.mode{border:1px solid #4c6380;border-radius:999px;padding:6px 10px;font-size:12px;font-weight:800}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.box{border:1px solid #27364b;border-radius:12px;padding:12px;background:#0a1420}.box small{display:block;color:#8ca2bd}.box b{font-size:19px;display:block;margin-top:4px}.hero{width:100%;max-height:360px;object-fit:contain;border-radius:12px;background:#07101c}.field{display:block;margin:12px 0}.field span{display:block;font-size:13px;color:#a9bad0;margin-bottom:6px}.field input{width:100%;box-sizing:border-box;background:#091321;color:#fff;border:1px solid #3a4d67;border-radius:12px;padding:14px;font-size:18px}.btn{width:100%;border:0;border-radius:13px;padding:15px;font-size:16px;font-weight:900;background:#21c55d;color:#06120a}.btn.secondary{background:#1f6feb;color:#fff}.btn:disabled{opacity:.45}.msg{margin-top:12px;padding:11px;border-radius:10px;background:#101c2a}.err{background:#3a1720;color:#ffd8df}.ok{background:#12321f;color:#c9fbd7}.muted{color:#8ca2bd}.impact{font-size:22px;font-weight:900}.hidden{display:none!important}@media(max-width:560px){.grid{grid-template-columns:1fr}.title{font-size:22px}}
</style></head><body><main class="page"><section class="card"><div class="head"><div><div class="k">REAL FACTORY · RRQ</div><h1 class="title">Final Rate Review</h1></div><span id="mode" class="mode">TEST</span></div><p id="who" class="muted">Loading secure approval…</p></section>
<section id="content" class="hidden"><section class="card"><img id="pic" class="hero hidden" alt="Mapped product"><div class="grid" style="margin-top:12px"><div class="box"><small>Lot No.</small><b id="lot">—</b></div><div class="box"><small>Qty</small><b id="qty">—</b></div><div class="box"><small>Mapped Costing Sale Rate</small><b id="source">—</b></div><div class="box"><small>Sales Team Suggestion</small><b id="salesSuggested">Pending</b></div><div class="box"><small>Admin Suggestion</small><b id="adminSuggested">Pending</b></div><div class="box"><small>Current Final Rate</small><b id="currentFinal">Pending</b></div></div><div class="box" style="margin-top:10px"><small>Item / Sizes</small><b id="item">—</b><span id="sizes" class="muted"></span></div></section>
<section id="suggestCard" class="card hidden"><label class="field"><span id="suggestLabel">Suggested RRQ Rate</span><input id="suggestInput" type="number" min="1" step="1" inputmode="numeric"></label><button id="suggestBtn" class="btn secondary" type="button">SUBMIT SUGGESTED RATE</button></section>
<section id="approveCard" class="card hidden"><label class="field"><span>Super Admin Final Approved Rate</span><input id="finalInput" type="number" min="1" step="1" inputmode="numeric"></label><div class="box"><small>Reserve Quota Change</small><div id="delta" class="impact">₹0</div><span id="impact" class="muted">Qty × rate difference</span></div><button id="approveBtn" class="btn" type="button" style="margin-top:12px">APPROVE FINAL RATE</button></section></section><div id="msg" class="msg">Opening secure request…</div></main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js?v=9346"></script><script src="real-common.js?v=9346"></script><script>
(()=>{'use strict';const $=id=>document.getElementById(id);const token=decodeURIComponent((location.hash||'').replace(/^#/,''));let ctx=null;const sb=()=>window.supabaseClient||window.supabaseDb||window.redzedSupabase||window.sb;function message(t,c=''){const m=$('msg');m.textContent=t;m.className='msg '+c}function money(v){return '₹'+Number(v||0).toLocaleString('en-IN')}async function rpc(n,a){const {data,error}=await sb().rpc(n,a);if(error)throw error;return data}function calc(){if(!ctx)return;const f=Number($('finalInput').value||0),src=Number(ctx.source_rate||0),q=Number(ctx.qty||0),d=f-src,im=d*q;$('delta').textContent=(d>=0?'+':'')+money(d)+' / pc';$('impact').textContent='Reserve Quota '+(im>=0?'+':'')+money(im)+' · '+q+' × '+d}function reopenWhatsApp(){setTimeout(()=>{location.href='whatsapp://send'},450)}async function load(){try{if(!token)throw Error('Approval token missing');const c=sb();if(!c?.auth)throw Error('App connection unavailable');const {data:s}=await c.auth.getSession();if(!s?.session){location.replace('real-login.html');return}ctx=await rpc('rr_pack_rate_token_context_v9346',{p_token:token});$('mode').textContent=ctx.data_mode;$('who').textContent='For: '+(ctx.recipient_name||'User')+' · '+String(ctx.recipient_role||'').toUpperCase();$('lot').textContent=ctx.lot_no;$('qty').textContent=Number(ctx.qty||0).toLocaleString('en-IN')+' PCS';$('source').textContent=money(ctx.source_rate);$('salesSuggested').textContent=ctx.sales_suggested_rate?money(ctx.sales_suggested_rate):'Pending';$('adminSuggested').textContent=ctx.admin_suggested_rate?money(ctx.admin_suggested_rate):'Pending';$('currentFinal').textContent=ctx.final_rate?money(ctx.final_rate):'Pending';$('item').textContent=ctx.item_name||'—';$('sizes').textContent=ctx.size_text||'';if(ctx.image_url){$('pic').src=ctx.image_url;$('pic').classList.remove('hidden')}if(ctx.can_suggest){$('suggestCard').classList.remove('hidden');const own=ctx.current_role==='sales'?ctx.sales_suggested_rate:ctx.admin_suggested_rate;$('suggestInput').value=own||ctx.source_rate||'';$('suggestLabel').textContent=ctx.current_role==='sales'?'Sales Team Suggested Rate':'Admin Suggested RRQ Rate'}if(ctx.can_approve){$('approveCard').classList.remove('hidden');$('finalInput').value=ctx.final_rate||ctx.admin_suggested_rate||ctx.sales_suggested_rate||ctx.source_rate||'';$('finalInput').addEventListener('input',calc);calc()}$('content').classList.remove('hidden');message(ctx.can_approve?'Review Sales/Admin suggestions and approve final rate.':'Review mapped costing rate and submit your suggestion.')}catch(e){message(e.message||String(e),'err')}}$('suggestBtn').addEventListener('click',async()=>{try{const v=Number($('suggestInput').value);if(!Number.isInteger(v)||v<=0)throw Error('Whole-rupee suggested rate required');$('suggestBtn').disabled=true;await rpc('rr_pack_rate_token_suggest_v9346',{p_token:token,p_suggested_rate:v});message('Suggested rate submitted successfully.','ok');reopenWhatsApp()}catch(e){message(e.message||String(e),'err');$('suggestBtn').disabled=false}});$('approveBtn').addEventListener('click',async()=>{try{const v=Number($('finalInput').value);if(!Number.isInteger(v)||v<=0)throw Error('Whole-rupee final rate required');$('approveBtn').disabled=true;const r=await rpc('rr_pack_rate_token_approve_v9346',{p_token:token,p_final_rate:v});message('Final rate approved · '+(r.art_code||'')+' · Packing AI unlocked.','ok');reopenWhatsApp()}catch(e){message(e.message||String(e),'err');$('approveBtn').disabled=false}});setTimeout(load,250)})();
</script></body></html>
