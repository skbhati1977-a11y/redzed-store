<!doctype html>
<html lang="hi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Distributor Login · TEST67</title>
    <style>
      :root {
        color-scheme: dark;
      }
      body {
        margin: 0;
        min-height: 100dvh;
        display: grid;
        place-items: center;
        padding: 18px;
        box-sizing: border-box;
        background: #07111d;
        color: #fff;
        font-family: system-ui, sans-serif;
      }
      main {
        width: min(430px, 100%);
        padding: 22px;
        border: 1px solid #36516b;
        border-radius: 20px;
        background: #101f2e;
      }
      small {
        display: block;
        color: #9fb0c3;
        line-height: 1.5;
      }
      #status {
        margin-top: 14px;
        color: #8fe0b7;
        font-weight: 800;
      }
      input,button{width:100%;box-sizing:border-box;margin-top:11px;padding:12px;border:1px solid #45617c;border-radius:10px;background:#09131f;color:#fff;font-size:16px}
      button{background:#fff;color:#111;font-weight:900}
    </style>
  </head>
  <body>
    <main>
      <h1>Distributor Login</h1>
      <small
        >इसी phone पर distributor name और mobile verify करें। Verification के
        बाद आपका private TEST67 workspace खुलेगा।</small
      >
      <div id="status">Secure workspace खोल रहे हैं…</div>
      <form id="loginForm" hidden>
        <input id="distributorName" autocomplete="name" placeholder="Distributor name" value="veer bhati" required>
        <input id="distributorMobile" autocomplete="tel" inputmode="tel" placeholder="Mobile number" required>
        <button id="loginButton" type="submit">OPEN DISTRIBUTOR WORKSPACE</button>
      </form>
    </main>
    <script>
      window.__RR_SLICE_MENU_LOADER_9309__ = true;
    </script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="config.js?v=67"></script>
    <script src="real-common.js?v=67"></script>
    <script src="rf-v853-core.js?v=67"></script>
    <script>
      (() => {
        const status = document.getElementById("status");
        const form = document.getElementById("loginForm");
        const deviceKey = "rr_customer_device_v9592";
        const device = () => {
          let id=localStorage.getItem(deviceKey);
          if(!id){const bytes=new Uint8Array(24);crypto.getRandomValues(bytes);id=[...bytes].map(x=>x.toString(16).padStart(2,"0")).join("");localStorage.setItem(deviceKey,id);}
          return id;
        };
        const auth = () => {
          const saved = JSON.parse(
            localStorage.getItem("rr_customer_secure_session_v9592") || "{}",
          );
          return {
            p_session_token: saved.session_token || "",
            p_device_id: device(),
          };
        };
        async function openWorkspace(showFormOnFailure=true) {
          try {
            const workspace = await RF853.rpc(
              "rr_market_partner_workspace_v67",
              auth(),
            );
            if (!workspace?.owner_name)
              throw Error("Distributor workspace उपलब्ध नहीं है।");
            status.textContent = "Verified ✓";
            location.replace("real-market-distributor-test67.html");
          } catch (error) {
            status.style.color = "#ff9da5";
            status.textContent = showFormOnFailure ? "Distributor name और mobile verify करें।" : (error.message || "Distributor verification failed.");
            if(showFormOnFailure) form.hidden=false;
          }
        }
        form.onsubmit=async(event)=>{event.preventDefault();const button=document.getElementById("loginButton");button.disabled=true;status.style.color="#8fe0b7";status.textContent="VERIFYING DISTRIBUTOR…";try{const result=await RF853.rpc("rr_market_partner_login_issue_v67",{p_name:document.getElementById("distributorName").value,p_mobile:document.getElementById("distributorMobile").value,p_device_id:device()});const ownerName=String(result.owner_name||document.getElementById("distributorName").value||"Distributor").trim();localStorage.setItem("rr_market_partner_owner_name_v67",ownerName);localStorage.setItem("rr_customer_secure_session_v9592",JSON.stringify({session_token:result.session_token,issued_at:new Date().toISOString(),relation:"DISTRIBUTOR",owner_name:ownerName}));await openWorkspace(false);}catch(error){status.style.color="#ff9da5";status.textContent=error.message||"Distributor verification failed.";button.disabled=false;}};
        openWorkspace(true);
      })();
    </script>
  </body>
</html>
