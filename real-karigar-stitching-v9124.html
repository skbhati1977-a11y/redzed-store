<head>
<meta charset="utf-8">

<title>REAL FACTORY — Karigar / Stitching</title>
<style>html,body{margin:0;width:100%;height:100%;background:#07090d;overflow:hidden}iframe{display:block;width:100%;height:100dvh;border:0;background:#07090d}</style>
</head>
<body>
<iframe id="app" title="Karigar / Stitching" src="real-universal-production-v770-v9059.html?dept=KR&label=Karigar%20%2F%20Stitching&v=9125"></iframe>
<script>
(() => {
  const frame=document.getElementById('app');
  const lock=()=>{
    try{
      const d=frame.contentDocument;if(!d)return;
      const h1=d.querySelector('.top h1');if(h1)h1.textContent='Karigar / Stitching';
      d.title='REAL FACTORY — Karigar / Stitching';
      const sel=d.getElementById('homeDept');
      if(sel){sel.style.display='none';sel.setAttribute('aria-hidden','true');}
      const toolbar=d.querySelector('.toolbar');
      if(toolbar){toolbar.style.display='block';const search=d.getElementById('search');if(search){search.style.width='100%';search.style.display='block';}}
      d.querySelectorAll('.rftitle h2').forEach(x=>{x.textContent=x.textContent.replace(/^.*?·/,'Karigar / Stitching ·');});
    }catch(e){console.warn('Karigar department lock',e)}
  };
  frame.addEventListener('load',()=>{lock();const d=frame.contentDocument;if(d)new MutationObserver(lock).observe(d.documentElement,{childList:true,subtree:true});setInterval(lock,1000);});
})();
</script>
</body>
</html>
