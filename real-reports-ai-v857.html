<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>REAL FACTORY - Reports AI V857</title>
  <link rel="stylesheet" href="real-style.css?v=887">
  <style>
    .rf-report-grid{display:grid;grid-template-columns:320px 1fr;gap:16px}.rf-report-list{display:grid;gap:8px}.rf-report-item{width:100%;padding:13px;border:1px solid #2a2a31;border-radius:12px;background:#17171b;color:#fff;text-align:left;font-weight:850}.rf-report-item small{display:block;margin-top:4px;color:#aaaab4;font-weight:600}.rf-ai-box{display:grid;gap:10px}.rf-ai-box textarea{min-height:110px;padding:13px;border:1px solid #34343d;border-radius:12px;background:#0f0f12;color:#fff;font:inherit}.rf-chip-row{display:flex;gap:8px;flex-wrap:wrap}.rf-chip{border:1px solid #34343d;border-radius:999px;background:#202936;color:#a8ccff;padding:8px 10px;font-weight:850}.rf-result{white-space:pre-wrap;line-height:1.55}.rf-table-wrap{overflow:auto}.rf-table{width:100%;min-width:900px;border-collapse:collapse}.rf-table th,.rf-table td{padding:10px;border-bottom:1px solid #2a2a31;text-align:left}.rf-table th{background:#20202a}@media(max-width:900px){.rf-report-grid{grid-template-columns:1fr}}
  </style>
</head>
<body class="rr-body">
  <header class="rr-topbar"><div><p class="rr-kicker">REAL FACTORY</p><h1>Reports & AI Query</h1></div><div class="rr-top-actions"><span class="rf-dashboard-version">V857</span><span id="ownerName" class="rr-owner-name">Loading...</span><a class="rr-btn rr-btn-secondary" href="real-dashboard.html?v=887">Dashboard</a><button id="logoutBtn" class="rr-btn rr-btn-secondary" type="button">Logout</button></div></header>
  <main class="rr-page">
    <section class="rr-hero"><div><p class="rr-muted">TEST DEFAULT</p><h2>Template Reports + AI Type Question</h2><p class="rr-muted">Search box me sawaal type karne par related template suggestions milenge; AI report backend se answer generate karega.</p></div></section>
    <section class="rf-report-grid">
      <aside class="rr-panel"><div class="rr-panel-head"><h2>Templates</h2></div><input id="reportSearch" type="search" placeholder="Search report / type question..." autocomplete="off" style="width:100%;min-height:44px;padding:10px;border-radius:12px;background:#0f0f12;color:#fff;border:1px solid #34343d"><div id="templateList" class="rf-report-list" style="margin-top:12px"></div></aside>
      <section class="rr-panel"><div class="rr-panel-head"><h2 id="activeTitle">AI Question Report</h2><button id="refreshBtn" class="rr-btn rr-btn-secondary" type="button">Refresh</button></div><div class="rf-ai-box"><textarea id="questionBox" placeholder="Example: is week ka production due aur sales stock summary batao"></textarea><div class="rf-chip-row" id="suggestions"></div><button id="askAiBtn" class="rr-btn rr-btn-primary" type="button">Ask AI / Generate Report</button><div id="reportResult" class="rf-result rr-panel"></div><div id="tableResult"></div></div></section>
    </section>
    <p id="pageMessage" class="rr-message" role="status"></p>
  </main>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js?v=887"></script><script src="real-reports-ai-v857.js?v=887"></script>
<script>
(function(){
  var V='887';
  function localHtml(h){try{var u=new URL(h,location.href);return u.origin===location.origin&&/\.html$/i.test(u.pathname)}catch(e){return false}}
  document.addEventListener('click',function(e){var a=e.target&&e.target.closest?e.target.closest('a[href]'):null;if(!a||a.target||a.hasAttribute('download'))return;var h=a.getAttribute('href')||'';if(!h||h[0]==='#'||/^(mailto:|tel:|javascript:)/i.test(h)||!localHtml(h))return;var u=new URL(h,location.href);if(u.searchParams.get('v')!==V){u.searchParams.set('v',V);e.preventDefault();location.href=u.href;}},true);
})();
</script>
</body>
</html>
