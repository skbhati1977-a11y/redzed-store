<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#08121d"><title>Recovery Accept</title><style>*{box-sizing:border-box}body{margin:0;background:#07090d;color:#fff;font:800 15px system-ui;padding:16px}.card{max-width:620px;margin:auto;background:#111722;border:1px solid #334155;border-radius:18px;padding:18px}.gold{color:#ffc857}.mut{color:#9ca3af}button{width:100%;min-height:52px;border:1px solid #49627a;border-radius:12px;background:#edf5fd;color:#102033;font:900 16px system-ui;margin-top:16px}.ok{color:#72e6a1}.bad{color:#ff8b8b}</style></head><body><main class="card"><div class="gold">SHORT / EXCESS · RECOVERY</div><h2 id="title">Recovery PCS</h2><div id="info" class="mut">Physical recovery accept करने के बाद same-stage Good Qty में merge होगा.</div><button id="accept">ACCEPT RECOVERY & MERGE GOOD</button><p id="msg"></p></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js?v=9780"></script><script src="real-common.js?v=126"></script><script>(()=>{'use strict';const q=new URLSearchParams(location.search),missing=q.get('missing'),eventId=q.get('event'),worker=q.get('worker'),$=x=>document.getElementById(x),db=()=>window.supabaseClient||window.supabaseDb||window.redzedSupabase||window.sb;async function boot(){const b=$('accept');b.onclick=async()=>{b.disabled=true;b.textContent='ACCEPTING…';try{const r=await db().rpc('rr_upm_missing_recovery_receiver_accept_v228',{p_missing_id:missing,p_event_id:eventId,p_worker_id:worker,p_remarks:null});if(r.error)throw r.error;$('msg').className='ok';$('msg').textContent='✓ '+(r.data?.merged_good_qty||'')+' PCS accepted and merged to Good';setTimeout(()=>{if(parent&&parent!==window)parent.postMessage({type:'RR_REAL_CHAT_ACTION_SUCCESS',action:'RECOVERY_ACCEPT',status:'WORKING'},location.origin);else history.back()},600)}catch(e){$('msg').className='bad';$('msg').textContent=e.message||String(e);b.disabled=false;b.textContent='ACCEPT RECOVERY & MERGE GOOD'}}}let t=setInterval(()=>{if(db()?.rpc){clearInterval(t);boot()}},100)})();</script></body></html>
