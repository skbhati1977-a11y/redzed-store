<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width,initial-scale=1,viewport-fit=cover,interactive-widget=resizes-content"
    />
    <title>REDZED COLLECTION</title>
    <style>
      html,
      body {
        margin: 0;
        min-height: 100%;
        background: #0c1016;
        color: #fff;
        font-family: system-ui, -apple-system, sans-serif;
      }
      #customerBoot {
        display: flex;
        align-items: center;
        justify-content: center;
        min-height: 100dvh;
        color: #9eabbc;
        font-size: 14px;
      }
    </style>
  </head>
  <body>
    <div id="customerBoot">Opening Real Chat…</div>
    <script>
      window.__RR_SLICE_MENU_LOADER_9309__ = true;
      (async () => {
        const token =
          new URLSearchParams(location.search).get("t") ||
          new URLSearchParams(location.search).get("c") ||
          "";
        const loadScript = (src) =>
          new Promise((resolve, reject) => {
            const script = document.createElement("script");
            script.src = src;
            script.async = false;
            script.onload = resolve;
            script.onerror = () => reject(Error(`LOAD FAILED · ${src}`));
            document.body.appendChild(script);
          });
        const baseScripts = [
          "real-customer-secure-session-addon-v9592.js?v=9668",
          "real-customer-chat-thumbnail-cache-v51.js?v=51",
          "real-customer-chat-image-upload-v54.js?v=58instant1",
          "real-customer-fullscreen-secure-chat-v9648.js?v=9668",
          "real-customer-chat-image-upload-hook-v54.js?v=56",
          "real-customer-attach-outside-close-v9649.js?v=9668",
          "real-customer-chat-media-stable-v9664.js?v=56",
          "real-customer-chat-universal-thumbnail-v9674.js?v=58persistent1",
          "real-customer-group-media-files-v59.js?v=59h-hold-swipe",
          "real-customer-chat-delete-disappearing-v59.js?v=60-exact-map3",
          "real-customer-chat-url-wrap-v9668.js?v=9668",
          "real-customer-chat-collection-card-v9605.js?v=9668",
          "real-customer-chat-collection-tune-v9606.js?v=9668",
          "real-customer-chat-collection-layout-v9623.js?v=9668",
          "real-customer-chat-stock-privacy-v9607.js?v=9668",
          "real-customer-chat-field-placeholder-v9625.js?v=9668",
          "real-customer-chat-commercial-actions-v9630.js?v=58c",
          "real-customer-chat-active-card-bottom-v9634.js?v=9668",
          "real-customer-requirement-state-v9641.js?v=9668",
          "real-customer-collection-header-v9619.js?v=9668",
          "real-customer-requirement-layout-v9645.js?v=9668",
        ];
        try {
          await loadScript(
            "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2",
          );
          await loadScript("config.js?v=9668");
          await loadScript("real-common.js?v=9668");
          await loadScript("rf-v853-core.js?v=9668");

          const relation = token
            ? await RF853.rpc("rr_market_share_relation_v81", {
                p_token: token,
              })
            : "REDZED_CUSTOMER";
          if (relation === "DISTRIBUTOR_CUSTOMER") {
            await loadScript(
              "real-market-partner-shared-chat-adapter-test67.js?v=82",
            );
            await loadScript(
              "real-market-partner-collection-core-adapter-test67.js?v=83",
            );
          }
          for (const src of baseScripts) await loadScript(src);
          await loadScript("real-mobile-back-step-test67.js?v=82");

          const openApprovedChat = () => {
            if (
              !window.RR_FULL_SECURE_CHAT_V9597 ||
              typeof RR_FULL_SECURE_CHAT_V9597.open !== "function"
            )
              return false;
            document.getElementById("customerBoot")?.remove();
            RR_FULL_SECURE_CHAT_V9597.open();
            return true;
          };
          let tries = 0;
          const start = () => {
            if (openApprovedChat()) return;
            if (++tries < 60) setTimeout(start, 100);
          };
          start();
        } catch (error) {
          document.getElementById("customerBoot").textContent =
            error.message || "Collection could not open.";
        }
      })();
    </script>
  </body>
</html>
