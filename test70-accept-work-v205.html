<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#08121d"><title>ACCEPT WORK</title><style>*{box-sizing:border-box}body{margin:0;background:#07090d;color:#fff;font:800 16px system-ui;padding:18px}.card{max-width:620px;margin:18px auto;background:#111722;border:1px solid #334155;border-radius:18px;padding:20px}.mut{color:#9ca3af}.gold{color:#ffc857}h1{margin:0 0 8px}label{display:grid;gap:7px;margin:16px 0}input,button{width:100%;min-height:54px;border-radius:12px;border:1px solid #445168;background:#202838;color:#fff;font:800 18px;padding:12px}button{background:#d63b59;border-color:#ed5b75}.row{padding:12px;border:1px solid #354154;border-radius:12px;margin:10px 0}.ok{color:#72e6a1}.bad{color:#ff8b8b}</style></head><body><main class="card"><div class="gold">REAL FACTORY · CANONICAL RECEIPT</div><h1>ACCEPT &amp; COUNT</h1><p id="state" class="mut">Loading exact assignment…</p><div id="body"></div></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js?v=9780"></script><script src="real-common.js?v=126"></script><script>(()=>{'use strict';
const q=new URLSearchParams(location.search),assignment=q.get('assignment')||q.get('rrAssignmentReceipt')||'',worker=q.get('worker')||q.get('rrWorkerContext')||'',state=document.getElementById('state'),body=document.getElementById('body'),db=()=>window.supabaseClient||window.supabaseDb||window.redzedSupabase||window.sb,num=v=>Number(v||0),esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
async function rpc(n,a={}){const r=await db().rpc(n,a);if(r.error)throw r.error;return r.data}
function completeToRealChat(batch){const payload={type:'RR_REAL_CHAT_ACTION_SUCCESS',action:'CONFIRM_RECEIVED_PCS',status:'WORKING',worker_id:worker,assignment_id:assignment,lot_no:String(batch.lot_no||''),department_code:String(batch.department_code||'')};if(window.parent&&window.parent!==window){window.parent.postMessage(payload,'*');try{window.parent.document.getElementById('actionSheet').hidden=true;window.parent.document.getElementById('actionFrame').src='about:blank'}catch(e){}return}const target=new URL(q.get('success_return')||q.get('return')||'test70-cb-purchase-real-chat-pilot.html',location.href);target.searchParams.set('rc_view','chat');target.searchParams.set('rc_kind','person');target.searchParams.set('rc_id',worker);target.searchParams.set('rc_status','WORKING');target.searchParams.set('rc_parent',String(batch.department_code||''));location.replace(target.pathname+target.search+target.hash)}
async function boot(){try{if(!assignment||!worker)throw Error('Exact assignment context missing.');const identity=await rpc('rr_upm_effective_identity_v200'),effectiveWorker=String(identity?.worker_id||'');if(effectiveWorker!==String(worker))await rpc('rr_test_set_on_behalf_context_v176',{p_worker_id:worker});const data=await rpc('rr_upm_my_pending_receipts_v9112'),rows=data?.rows||[],batch=rows.find(b=>(b.colour_rows||[]).some(r=>String(r.assignment_id)===String(assignment)));if(!batch)throw Error('This exact assignment is no longer pending for this worker.');const cr=batch.colour_rows||[];state.innerHTML=`Lot <b>${esc(batch.lot_no)}</b> · ${esc(batch.department_code)} · Expected ${cr.reduce((s,r)=>s+num(r.expected_qty),0)} PCS`;body.innerHTML=cr.map(r=>`<label class="row">${esc(r.colour_code)} · EXPECTED ${num(r.expected_qty)} PCS<input class="qty" data-id="${esc(r.assignment_id)}" data-expected="${num(r.expected_qty)}" type="number" min="0" value="${num(r.expected_qty)}"></label>`).join('')+`<label>SHORT / EXCESS REMARKS<input id="note" placeholder="Required when accepted count differs"></label><button id="accept">ACCEPT WORK · CONFIRM PCS</button><p id="msg"></p>`;document.getElementById('accept').onclick=async()=>{const btn=document.getElementById('accept'),inputs=[...document.querySelectorAll('.qty')],vals=inputs.map(i=>({assignment_id:i.dataset.id,confirmed_qty:num(i.value),expected_qty:num(i.dataset.expected)})),note=document.getElementById('note').value.trim(),msg=document.getElementById('msg');try{if(vals.some(x=>x.confirmed_qty<0))throw Error('Accepted Qty must be zero or greater.');if(vals.some(x=>x.confirmed_qty!==x.expected_qty)&&!note)throw Error('Short / Excess remarks required.');btn.disabled=true;btn.textContent='ACCEPTING…';await rpc('rr_upm_accept_physical_count_batch_v802',{p_receipt_batch_id:batch.receipt_batch_id,p_rows:vals.map(x=>({assignment_id:x.assignment_id,confirmed_qty:x.confirmed_qty})),p_note:note||null});try{await rpc('rr_real_chat_sync_upm_history_v71')}catch(e){console.warn('Real Chat sync after accept',e)}msg.className='ok';msg.textContent='ACCEPTED · WORKING';btn.textContent='ACCEPTED · WORKING';inputs.forEach(i=>i.disabled=true);document.getElementById('note').disabled=true;completeToRealChat(batch)}catch(e){msg.className='bad';msg.textContent=e.message||String(e);btn.disabled=false;btn.textContent='ACCEPT WORK · CONFIRM PCS'}}}catch(e){state.className='bad';state.textContent=e.message||String(e)}}
let tries=0,t=setInterval(()=>{if(db()?.rpc){clearInterval(t);boot()}else if(++tries>80){clearInterval(t);state.textContent='Supabase unavailable.'}},100)})();</script></body></html>
