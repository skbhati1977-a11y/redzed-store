<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Secure Chat Repeat V9595</title><style>body{margin:0;font-family:system-ui;background:#0c1016;color:#fff}.w{max-width:760px;margin:auto;padding:18px}button,input{width:100%;box-sizing:border-box;padding:15px;margin:6px 0;font-size:17px}pre{white-space:pre-wrap;overflow:auto;background:#151c26;border:1px solid #334155;border-radius:12px;padding:12px;min-height:160px;max-height:48vh}.ok{color:#8ff0a4}.bad{color:#ff9b9b}</style></head><body><div class="w"><h2>SECURE CHAT V9595 · REPEAT TEST</h2><p>This page stays here. READ/SEND never opens Group Chat and never navigates away.</p><button id="session">CHECK SECURE SESSION</button><button id="read">READ CHAT SECURELY</button><input id="msg" value="STEP11 V9595 BROWSER TEST"><button id="send">SEND TEST MESSAGE SECURELY</button><button id="read2">READ AGAIN</button><pre id="out">Loading secure session…</pre></div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="config.js?v=9435"></script><script src="real-common.js"></script><script src="rf-v853-core.js"></script><script src="real-customer-secure-session-addon-v9592.js?v=9595"></script><script>(()=>{const out=document.getElementById('out');function show(t,x,ok=true){out.className=ok?'ok':'bad';out.textContent=t+(x?'\n'+(typeof x==='string'?x:JSON.stringify(x,null,2)):'')}async function ctx(){await RR_CUSTOMER_SECURE_SESSION_V9592.ensure();const s=JSON.parse(localStorage.getItem('rr_customer_secure_session_v9592')||'null');if(!s?.session_token)throw Error('Secure session missing');return{t:s.session_token,d:RR_CUSTOMER_SECURE_SESSION_V9592.device()}}async function check(){try{const x=await ctx(),v=await RF853.rpc('rr_customer_session_validate_v9590',{p_session_token:x.t,p_device_id:x.d});show('SESSION PASS',v)}catch(e){show('SESSION ERROR',e.message,false)}}async function read(){try{const x=await ctx(),r=await RF853.rpc('rr_chat_customer_messages_session_v9593',{p_session_token:x.t,p_device_id:x.d,p_channel:'GROUP',p_limit:10});show('SECURE READ PASS · '+r.length+' messages',r)}catch(e){show('READ ERROR',e.message,false)}}async function send(){try{const x=await ctx(),body=document.getElementById('msg').value.trim();if(!body)throw Error('Enter test message');const id=await RF853.rpc('rr_chat_customer_send_session_v9593',{p_session_token:x.t,p_device_id:x.d,p_channel:'GROUP',p_message_type:'TEXT',p_body:body,p_payload:{test:'V9595'},p_reply_to:null});show('SECURE SEND PASS','message_id: '+id+'\nNow press READ AGAIN.')}catch(e){show('SEND ERROR',e.message,false)}}document.getElementById('session').onclick=check;document.getElementById('read').onclick=read;document.getElementById('read2').onclick=read;document.getElementById('send').onclick=send;window.addEventListener('popstate',e=>{history.pushState({v9595:true},'',location.href)});history.replaceState({v9595:true},'',location.href);setTimeout(check,300)})();</script></body></html>
